<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OSK 触发 · 简版</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/ethers@6.13.4/dist/ethers.umd.min.js';s.onload=function(){if(window.__boot)window.__boot()};document.head.appendChild(s);"></script>
<style>
  :root{
    --bg:#0b0f16; --card:#141a24; --card2:#1b2331; --line:#253040;
    --txt:#e6edf7; --dim:#8b9bb4; --acc:#4c9aff; --ok:#2ecc71; --warn:#f5a623; --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:rgba(11,15,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 18px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1100px;margin:0 auto}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  .spacer{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:8px 14px;border-radius:8px;font-size:13px;transition:.15s}
  button:hover:not(:disabled){border-color:var(--acc);color:#fff}
  button:disabled{opacity:.38;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#2d7ff9,#1f63cc);border-color:#2d7ff9;color:#fff;font-weight:600}
  button.ok{background:linear-gradient(180deg,#22b35e,#178c47);border-color:#22b35e;color:#fff;font-weight:600}
  .mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
  main{max-width:1100px;margin:0 auto;padding:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .card.paused{border-color:#5a2b2b}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .tag.warn{border-color:#7a4a12;color:var(--warn)}
  .tag.ok{border-color:#1d6b3f;color:#4ee08a}
  .addr{font-size:13px;word-break:break-all}
  .addr a{color:var(--acc);text-decoration:none;font-size:11px}
  .bal{flex:1 1 130px;text-align:right}
  .bal .k{font-size:11px;color:var(--dim)}
  .bal .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .bal .v.zero{color:var(--dim)}
  .card button.ok{min-width:150px}
  .entry{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;word-break:break-all}
  .entry.ok{border-left-color:var(--ok)}
  .entry.err{border-left-color:var(--err)}
  .entry .t{color:var(--dim);margin-right:8px}
  .wallet{font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.bal{text-align:left}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>OSK 触发 · 简版</h1>
    <span class="wallet" id="netTag">未连接</span>
    <div class="spacer"></div>
    <button id="btnRefresh">刷新</button>
    <button class="primary" id="btnAllOsk">全部触发 OSK（免费）</button>
    <button id="btnConnect">连接钱包</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>
<div id="log" style="max-width:1100px;margin:0 auto;padding:0 18px 40px"></div>

<div id="picker" style="display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.65);backdrop-filter:blur(3px)">
  <div style="max-width:420px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px">
    <div style="font-weight:600;margin-bottom:12px">选择钱包</div>
    <div id="pickerList" style="display:flex;flex-direction:column;gap:8px"></div>
    <button style="margin-top:14px;width:100%" id="pickerCancel">取消</button>
  </div>
</div>

<script>
/* ============================ 配置 ============================ */
const BSC_CHAIN_ID = "0x38";
const BSC_RPC = "https://bsc-dataseed.binance.org";
const OSK = "0x81215684Ef11f6e8050bc6B34448e71DE264dc74";

const TARGETS = [
  { addr:"0xe470bb16a39710db249dc39bBdB934F10fcbF000", name:"路由器 / 汇总合约" },
  { addr:"0xFe6085Dd822acc23352FB6B1Fe52509253492422", name:"B 钱包 · 5 人均分" },
  { addr:"0x0c08701A698A01C82BBBCe9e9a92f6f6fb2BA2b2", name:"A 池 · 均分" },
  { addr:"0x4E3f963f318aCcd45e608b9A4f92E1D154B580bc", name:"B 池 · 均分" },
  { addr:"0x1651106F4E1BDf5b4f1956C91fFB1432489Eb061", name:"C 池 · 均分" },
  { addr:"0x8AA46f7f5fA7a04F03C650509E8C265169EeC2a5", name:"D 钱包 · 按比例" },
  { addr:"0xf9844C0F85F3C2D0334EF18808Aa16DF54F1F5D3", name:"E 钱包 · 按比例" },
];

/* ============================ ABI ============================ */
const ABI_A = [
  "function getOskStats() view returns (uint256 accumulated,uint256 members,uint256 remaining,uint256 perShare)",
  "function memberCount() view returns (uint256)",
  "function paused() view returns (bool)",
  "function triggerOskDistribution()",
];
const ABI_B = [
  "function getTokenStats(address) view returns (uint256 accumulated,uint256 members,uint256 remaining,uint256 perShare)",
  "function memberCount() view returns (uint256)",
  "function paused() view returns (bool)",
  "function allowedToken(address) view returns (bool)",
  "function triggerTokenDistribution(address)",
];
const ABI_C = [
  "function getTokenStats(address) view returns (uint256 accumulated,uint256 members,uint256 totalBp,uint256 remaining)",
  "function memberCount() view returns (uint256)",
  "function paused() view returns (bool)",
  "function allowedToken(address) view returns (bool)",
  "function triggerTokenDistribution(address)",
];
const ABI_D = [
  "function paused() view returns (bool)",
  "function trigger()",
];
const ERC20 = [
  "function balanceOf(address) view returns (uint256)",
  "function decimals() view returns (uint8)",
  "function symbol() view returns (string)",
];

const ERRORS = {
  "0x525af860":"NoMembers() 没有成员",
  "0x1c26714c":"InsufficientGas() gas 不足 1,000,000",
  "0x1ca02fbc":"InvalidTriggerFee(uint256,uint256) 触发费必须恰好 0.001 BNB",
  "0x94403b70":"TokenNotAllowed(address) 代币未加入白名单",
  "0xd93c0665":"EnforcedPause() 合约已暂停",
  "0x90b8ec18":"TransferFailed() 转账失败",
  "0x73c99501":"DistributionInProgress() 分发进行中，禁止配置变更",
  "0xd92e233d":"ZeroAddress() 零地址",
  "0x291fc442":"NotMember() 不是成员",
  "0xba348cfa":"TokenZeroAddress() 代币为零地址",
  "0x29c2ab0c":"MemberLimitExceeded(uint256) 成员数超上限",
  "0x810074be":"AlreadyMember() 已是成员",
  "0x8cb87168":"ContractNotAllowed() 不允许合约地址触发",
  "0x118cdaa7":"OwnableUnauthorizedAccount(address) 非 owner",
};

/* ============================ 工具 ============================ */
const $ = (id) => document.getElementById(id);
const short = (a) => a ? a.slice(0,6) + "…" + a.slice(-4) : "";
const fmt = (v, d = 18, max = 4) => {
  const s = ethers.formatUnits(v, d);
  const [i, f] = s.split(".");
  return f ? i + "." + f.slice(0, max) : i;
};
let provider = null, signer = null, account = null;
let readProvider = null;
function rp() {
  if (!readProvider) readProvider = new ethers.JsonRpcProvider(BSC_RPC, 56, { staticNetwork: true });
  return readProvider;
}

function log(msg, cls = "") {
  const el = document.createElement("div");
  el.className = "entry " + cls;
  el.innerHTML = `<span class="t">${new Date().toLocaleTimeString()}</span>${msg}`;
  $("log").prepend(el);
  while ($("log").children.length > 40) $("log").lastChild.remove();
}

function decodeError(e) {
  const cands = [
    e?.data, e?.error?.data, e?.info?.error?.data, e?.revert?.data,
    e?.data?.data, e?.error?.data?.data,
  ];
  for (const raw of cands) {
    if (typeof raw === "string" && raw.length >= 10) {
      const sel = raw.slice(0, 10).toLowerCase();
      if (ERRORS[sel]) return ERRORS[sel];
      if (raw.length > 10) return `自定义错误 ${sel} 参数 ${raw.slice(10)}`;
      return `自定义错误 ${sel}`;
    }
  }
  return e?.shortMessage || e?.reason || e?.message || String(e);
}

/* ============================ 类型识别 ============================ */
const FAMILY_META = {
  A: { label: "A 型", cls: "ok", abi: ABI_A },
  B: { label: "B 型", cls: "", abi: ABI_B },
  C: { label: "C 型", cls: "", abi: ABI_C },
  D: { label: "路由", cls: "", abi: ABI_D },
};
async function detectFamily(addr) {
  const code = (await rp().getCode(addr)).toLowerCase();
  if (code.length <= 2) return null;
  if (code.includes("fd636b26")) return "C";
  if (code.includes("3c7568ea")) return "A";
  if (code.includes("d6c48389")) return "B";
  if (code.includes("673a2a1f")) return "D";
  return null;
}

/* ============================ 卡片 ============================ */
const state = new Map(); // addr -> {family, abi, data}

function cardHTML(t, family) {
  const m = FAMILY_META[family];
  const isD = family === "D";
  return `
  <div class="card" id="card-${t.addr}">
    <span class="tag ${m.cls}">${m.label}</span>
    <span class="tag" data-role="paused">—</span>
    <span class="addr mono">${t.addr}
      <a href="https://bscscan.com/address/${t.addr}" target="_blank" rel="noopener">bscscan ↗</a>
    </span>
    <span class="bal">
      <div class="k">${isD ? "OSK 余额" : "OSK 余额 / 触发费"}</div>
      <div class="v" data-k="osk">—</div>
    </span>
    ${isD
      ? `<button class="ok" data-act="triggerRouter">触发 trigger()（免费）</button>`
      : `<button class="ok" data-act="triggerOsk">触发 OSK（免费）</button>`}
  </div>`;
}

/* ============================ 读取状态 ============================ */
async function refreshCard(t) {
  const st = state.get(t.addr);
  if (!st) return;
  const card = document.getElementById("card-" + t.addr);
  if (!card) return;
  const c = new ethers.Contract(t.addr, st.abi, rp());
  try {
    const paused = await c.paused().catch(() => false);
    const pt = card.querySelector('[data-role="paused"]');
    pt.textContent = paused ? "已暂停" : "运行中";
    pt.className = "tag " + (paused ? "warn" : "ok");
    card.classList.toggle("paused", !!paused);

    const oskB = await new ethers.Contract(OSK, ERC20, rp()).balanceOf(t.addr).catch(() => 0n);
    const oskEl = card.querySelector('[data-k="osk"]');
    const btn = card.querySelector("button");

    if (st.family === "D") {
      oskEl.textContent = fmt(oskB);
      oskEl.className = "v " + (oskB === 0n ? "zero" : "");
      if (btn) btn.disabled = false;
      st.data = { oskB };
      return;
    }

    const isA = st.family === "A";
    const [oskStats, memCount, allowed] = await Promise.all([
      isA ? c.getOskStats().catch(() => null) : c.getTokenStats(OSK).catch(() => null),
      c.memberCount().catch(() => 0n),
      isA ? Promise.resolve(true) : c.allowedToken(OSK).catch(() => false),
    ]);
    const oskAcc = oskStats ? oskStats[0] : 0n;
    const oskRem = oskStats ? oskStats[2] : 0n;

    // 显示：OSK 余额；正在进行时追加「剩余人数」
    let label = fmt(oskB);
    if (oskAcc > 0n) label += ` · 剩 ${oskRem.toString()} 人`;
    oskEl.textContent = label;
    oskEl.className = "v " + (oskB === 0n && oskAcc === 0n ? "zero" : "");

    // 按钮启用：A 型空闲时也可触发；B/C 型要求已记账且白名单
    if (btn) btn.disabled = paused || memCount === 0n || (!isA && (oskAcc === 0n || !allowed));
    st.data = { oskAcc, oskRem, memCount, paused, allowed };
  } catch (e) {
    log(`读取 ${short(t.addr)} 失败：${decodeError(e)}`, "err");
  }
}

async function refreshAll() {
  await Promise.all(TARGETS.map(refreshCard));
}

/* ============================ 交易 ============================ */
async function ensureSigner() {
  if (!signer) throw new Error("请先连接钱包");
  const net = await provider.getNetwork();
  if (net.chainId !== 56n) throw new Error("请切换到 BSC 主网（chainId 56）");
}

async function send(t, act) {
  const st = state.get(t.addr);
  const c = new ethers.Contract(t.addr, st.abi, signer);
  if (act === "triggerOsk") {
    if (st.family === "A") return await c.triggerOskDistribution({ gasLimit: 3000000n });
    return await c.triggerTokenDistribution(OSK, { gasLimit: 3000000n });
  }
  if (act === "triggerRouter") return await c.trigger({ gasLimit: 800000n });
}

async function runAct(t, act) {
  try {
    await ensureSigner();
  } catch (e) {
    log(decodeError(e), "err");
    return;
  }
  try {
    const tx = await send(t, act);
    if (tx) {
      log(`${t.name} 已发送 <a href="https://bscscan.com/tx/${tx.hash}" target="_blank" rel="noopener">${short(tx.hash)}</a>`, "ok");
      await tx.wait();
      log(`${t.name} 已确认`, "ok");
    }
  } catch (e) {
    log(`${t.name} · ${act} 失败：${decodeError(e)}`, "err");
  }
  await refreshCard(t);
  const st = state.get(t.addr);
  if (st?.data?.oskRem && st.data.oskRem > 0n) {
    log(`${t.name} 本轮剩余 ${st.data.oskRem.toString()} 人，可再点一次直到归零`, "");
  }
}

/* ============================ 钱包发现（EIP-6963 + 兜底） ============================ */
const injected = new Map();
window.addEventListener("eip6963:announceProvider", (ev) => {
  const d = ev.detail;
  if (!d || !d.provider) return;
  injected.set(d.info?.uuid || d.info?.name || Math.random().toString(36), d);
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

function collectProviders() {
  const out = [];
  for (const d of injected.values()) {
    out.push({ name: d.info?.name || "Injected", icon: d.info?.icon, provider: d.provider });
  }
  const w = window;
  const seen = new Set(out.map((x) => x.provider));
  const push = (name, p, icon) => {
    if (p && typeof p.request === "function" && !seen.has(p)) {
      seen.add(p);
      out.push({ name, icon, provider: p });
    }
  };
  if (Array.isArray(w.ethereum?.providers)) {
    w.ethereum.providers.forEach((p, i) => push(p.isMetaMask ? "MetaMask" : (p.isOkxWallet ? "OKX Wallet" : `钱包 ${i + 1}`), p));
  }
  push(w.okxwallet?.isOkxWallet ? "OKX Wallet" : "OKX Wallet", w.okxwallet);
  push(w.bitkeep?.ethereum ? "Bitget Wallet" : "Bitget Wallet", w.bitkeep?.ethereum);
  push(w.tokenpocket?.ethereum ? "TokenPocket" : "TokenPocket", w.tokenpocket?.ethereum);
  push(w.ethereum?.isMetaMask ? "MetaMask" : "浏览器钱包", w.ethereum);
  return out;
}

function chooseProvider(list) {
  return new Promise((resolve) => {
    const box = $("picker"), listEl = $("pickerList");
    listEl.innerHTML = "";
    list.forEach((p) => {
      const b = document.createElement("button");
      b.className = "primary";
      b.style.textAlign = "left";
      b.textContent = p.name;
      b.addEventListener("click", () => { box.style.display = "none"; resolve(p); });
      listEl.appendChild(b);
    });
    $("pickerCancel").onclick = () => { box.style.display = "none"; resolve(null); };
    box.style.display = "";
  });
}

const FILE_HINT = `检测不到钱包注入，通常是 file:// 直接打开导致的。请用本地 HTTP 服务打开本页面。`;

async function init() {
  const grid = $("grid");
  grid.innerHTML = TARGETS.map((t) => cardHTML(t, "B")).join("");
  for (const t of TARGETS) {
    const family = await detectFamily(t.addr).catch(() => null);
    const holder = document.getElementById("card-" + t.addr);
    if (!family) {
      holder.innerHTML = `<div class="card"><span class="tag warn">无法识别</span>
        <span class="addr mono">${t.addr}</span></div>`;
      continue;
    }
    state.set(t.addr, { family, abi: FAMILY_META[family].abi });
    holder.outerHTML = cardHTML(t, family);
    const card = document.getElementById("card-" + t.addr);
    card.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      runAct(t, btn.dataset.act);
    });
  }
  await refreshAll();
  setInterval(refreshAll, 25000);
}

/* 钱包 */
async function connect(forced) {
  let picked = forced;
  if (!picked) {
    const list = collectProviders();
    if (list.length === 0) {
      log("未检测到钱包扩展。" + FILE_HINT, "err");
      return;
    }
    picked = list.length === 1 ? list[0] : await chooseProvider(list);
    if (!picked) return;
  }
  try {
    const eth = picked.provider;
    await eth.request({
      method: "wallet_addEthereumChain",
      params: [{
        chainId: BSC_CHAIN_ID,
        chainName: "BNB Smart Chain",
        nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
        rpcUrls: [BSC_RPC],
        blockExplorerUrls: ["https://bscscan.com"],
      }],
    }).catch(() => {});
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: BSC_CHAIN_ID }] }).catch(() => {});
    provider = new ethers.BrowserProvider(eth);
    signer = await provider.getSigner();
    account = await signer.getAddress();
    $("btnConnect").textContent = short(account);
    $("netTag").innerHTML = `<span class="dot on"></span>${picked.name} · BSC · ${short(account)}`;
    log(`已连接：${picked.name} / ${account}`, "ok");
    await refreshAll();
  } catch (e) {
    log("连接失败：" + decodeError(e), "err");
  }
}

$("btnConnect").addEventListener("click", () => connect());
$("btnRefresh").addEventListener("click", () => refreshAll().then(() => log("已刷新")));
$("btnAllOsk").addEventListener("click", async () => {
  if (!account) { log("请先连接钱包", "err"); return; }
  if (!confirm("将依次对所有可触发的合约触发 OSK 分发（每笔免费，需逐笔确认）。继续？")) return;
  for (const t of TARGETS) {
    const st = state.get(t.addr);
    if (!st || st.family === "D") continue;
    const d = st.data;
    if (!d || d.memCount === 0n || d.paused || (st.family !== "A" && (d.oskAcc === 0n || !d.allowed))) continue;
    await runAct(t, "triggerOsk");
  }
});

function boot() {
  if (window.__booted) return;
  if (!window.ethers) {
    log("ethers.js 加载失败：请检查网络", "err");
    return;
  }
  window.__booted = true;
  const list = collectProviders();
  if (list.length === 0) {
    setTimeout(() => {
      const again = collectProviders();
      if (again.length === 1) {
        again[0].provider.request({ method: "eth_accounts" })
          .then((accs) => { if (accs && accs.length) connect(again[0]); })
          .catch(() => {});
      }
    }, 800);
  } else if (list.length === 1) {
    list[0].provider.request({ method: "eth_accounts" })
      .then((accs) => { if (accs && accs.length) connect(list[0]); })
      .catch(() => {});
  }
  init();
}
window.__boot = boot;
window.addEventListener("load", boot);
</script>
</body>
</html>
