/* ══ BSC RPC 通道白名单 + 自动故障转移 ══════════════════════════════════════
   通道来源: warstaking 实测白名单 (国内直连优先, 海外镜像兜底), 已逐个实测
   eth_chainId == 0x38。策略与上游一致: 并行探测延迟 → 升序排名 → 失败自动切下一通道。
   ⚠️ 避坑: 原产物把 RPC 写死为单个 bsc-dataseed.binance.org 且回退到自己(等于无回退),
      该节点按 IP 限流, 一旦抖动整页读不出数据。此处仅接管「只读」调用;
      参与游戏/授权/签名等写操作仍然走 window.ethereum, 私钥与签名不离开钱包。 */
(function () {
  'use strict';
  var CHAIN_ID = '0x38';
  var PROBE_MS = 2500;
  var CALL_MS = 8000;
  var BAD_MS = 60000;
  var CACHE_KEY = 'fistfarm.rpc.rank.v1';
  var CACHE_TTL = 5 * 60 * 1000;

  var ENDPOINTS = [
    { n: 'TokenPocket', u: 'https://bsc.mytokenpocket.vip' },
    { n: '48Club',      u: 'https://rpc-bsc.48.club' },
    { n: 'BNB Chain',   u: 'https://bsc-dataseed.bnbchain.org' },
    { n: 'defibit2',    u: 'https://bsc-dataseed2.defibit.io' },
    { n: 'defibit3',    u: 'https://bsc-dataseed3.defibit.io' },
    { n: 'defibit4',    u: 'https://bsc-dataseed4.defibit.io' },
    { n: '1RPC',        u: 'https://1rpc.io/bnb' },
    { n: 'PublicNode',  u: 'https://bsc-rpc.publicnode.com' },
    { n: 'BlastAPI',    u: 'https://bsc-mainnet.public.blastapi.io' },
    { n: 'MeowRPC',     u: 'https://bsc.meowrpc.com' }
  ];
  var NAME = {};
  ENDPOINTS.forEach(function (e) { NAME[e.u] = e.n; });
  var ALL = ENDPOINTS.map(function (e) { return e.u; });

  var bad = {};
  var order = null;
  var ranking = null;
  var seq = 1;

  function now() { return Date.now(); }
  function isBad(u) { return bad[u] && bad[u] > now(); }
  function rank0() { return (window.performance && window.performance.now) ? window.performance.now() : now(); }

  function rpc(url, method, params, ms) {
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { try { ctl.abort(); } catch (_) {} }, ms) : null;
    var opts = {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: seq++, method: method, params: params || [] })
    };
    if (ctl) opts.signal = ctl.signal;
    return fetch(url, opts).then(function (res) {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.transport = true; throw e; }
      return res.json();
    }).then(function (json) {
      if (json && json.error) {
        var e2 = new Error(json.error.message || 'RPC error');
        e2.rpcError = true;
        e2.code = json.error.code;
        e2.data = json.error.data;
        throw e2;
      }
      return json ? json.result : undefined;
    }).catch(function (e) {
      if (timer) { clearTimeout(timer); timer = null; }
      if (e && !e.rpcError) e.transport = true;
      throw e;
    });
  }

  function restore() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.t || (now() - o.t) > CACHE_TTL) return null;
      if (!Array.isArray(o.o)) return null;
      var list = o.o.filter(function (u) { return NAME[u]; });
      return list.length ? list : null;
    } catch (_) { return null; }
  }

  function persist(list) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: now(), o: list })); } catch (_) {}
  }

  function rank() {
    if (ranking) return ranking;
    ranking = Promise.all(ENDPOINTS.map(function (e) {
      var t0 = rank0();
      return rpc(e.u, 'eth_chainId', [], PROBE_MS).then(function (id) {
        if (String(id).toLowerCase() !== CHAIN_ID) return null;
        return { u: e.u, ms: rank0() - t0 };
      }).catch(function () { return null; });
    })).then(function (rs) {
      var ok = rs.filter(Boolean).sort(function (a, b) { return a.ms - b.ms; });
      var list = ok.map(function (x) { return x.u; });
      ALL.forEach(function (u) { if (list.indexOf(u) < 0) list.push(u); });
      order = list;
      persist(list);
      ranking = null;
      sync();
      return list;
    }).catch(function () { ranking = null; return current(); });
    return ranking;
  }

  function current() { return order || restore() || ALL; }

  function send(method, params) {
    var list = current().filter(function (u) { return !isBad(u); });
    if (!list.length) list = current();
    var i = 0;
    function step() {
      if (i >= list.length) {
        var e = new Error('所有 RPC 通道均不可用');
        e.transport = true;
        return Promise.reject(e);
      }
      var url = list[i++];
      return rpc(url, method, params, CALL_MS).then(function (r) {
        return r;
      }, function (err) {
        if (err && err.rpcError) throw err;
        bad[url] = now() + BAD_MS;
        return step();
      });
    }
    return step();
  }

  var WALLET_ONLY = /^(eth_requestAccounts|eth_accounts|eth_sendTransaction|eth_sendRawTransaction|eth_sign|personal_sign|eth_signTypedData.*|wallet_.*|eth_subscribe|eth_unsubscribe)$/i;

  var shim = {
    isFarmRpcShim: true,
    request: function (payload) {
      var method = (payload && payload.method) ? String(payload.method) : '';
      var params = (payload && payload.params) || [];
      if (WALLET_ONLY.test(method)) {
        if (window.ethereum && window.ethereum !== shim && typeof window.ethereum.request === 'function') {
          return window.ethereum.request(payload);
        }
        return Promise.reject(new Error('该操作需要钱包: ' + method));
      }
      return send(method, params);
    }
  };

  function sync() { window.__FARM_RPC_LIST__ = current(); }

  window.__FARM_ETH__ = shim;
  window.__FARM_RPC_STATUS__ = function () {
    return {
      order: current().map(function (u) { return NAME[u] || u; }),
      bad: Object.keys(bad).filter(isBad).map(function (u) { return NAME[u] || u; })
    };
  };
  sync();
  rank();
  setInterval(rank, 120000);
})();
</script>
<script defer="defer" src="./static/js/main.ea8cb2d5.js"></script><script defer="defer" src="./i18n.js"></script><link href="./static/css/main.c0ab5cf0.css" rel="stylesheet"></head><body><noscript>请启用 JavaScript 后使用本应用。</noscript><div id="root"></div><style>#back-home{position:fixed;left:12px;bottom:12px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(15,118,110,.92);color:#fff;font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}#back-home:hover{background:#0d9488}</style><a id="back-home" href="../" aria-label="返回主站">← 返回主站</a><script>
/* ══ 推荐关系绑定面板 ══════════════════════════════════════════════════════
   为什么需要这个面板：新版 FarmGuess 的 placeBet() 强制要求 referrer != 0，
   未绑定的地址参与游戏会直接 revert ReferrerRequired()。而 React 产物里没有绑定入口，
   所以这里补一个独立面板（只做 setReferrer / referrer 两个调用，不碰游戏逻辑）。

   读写通道：
     - 读  referrer(address) / 业绩  走 window.__FARM_ETH__（10 通道故障转移池）
     - 写  setReferrer(address)      走 window.ethereum（私钥不离开钱包）
   ⚠️ 避坑：不要用 __FARM_ETH__ 发 eth_sendTransaction 以外的自定义方法；shim 只把
      钱包专属方法（含 eth_sendTransaction）透传给 window.ethereum。 */
(function () {
  'use strict';

  var FARM = '0xea8cb2d57d40dafac22b24fde661dd6b64f90848';
  var SEL_SET_REFERRER = '0xa18a7bfc';   // setReferrer(address)
  var SEL_REFERRER = '0x2cf003c2';       // referrer(address)
  var SEL_TEAM = '0x615f36a9';           // getTeamVolume(address)         下线业绩
  var SEL_OWN_TEAM = '0x9933e53b';       // getPersonalPlusTeamVolume(address) 本人+下线
  var SEL_ROOT_USER = '0xaa3763f7';      // rootUser()  网络根地址，免绑定
  var SEL_IS_REGISTERED = '0xc3c5a547';  // isRegistered(address) 是否已在树内

  function eth() {
    return window.__FARM_ETH__ || window.ethereum || null;
  }
  function wallet() {
    return window.ethereum || null;
  }
  function pad32(addr) {
    return String(addr).toLowerCase().replace(/^0x/, '').padStart(64, '0');
  }
  function isAddr(s) {
    return /^0x[0-9a-fA-F]{40}$/.test(String(s || '').trim());
  }
  function fmt18(hexOrBig) {
    try {
      var v = typeof hexOrBig === 'bigint' ? hexOrBig : BigInt(hexOrBig);
      var whole = v / 1000000000000000000n;
      var frac = (v % 1000000000000000000n).toString().padStart(18, '0').slice(0, 4);
      return whole.toString() + '.' + frac;
    } catch (e) { return '-'; }
  }

  function call(to, data) {
    var e = eth();
    if (!e) return Promise.reject(new Error('RPC 不可用'));
    return e.request({ method: 'eth_call', params: [{ to: to, data: data }, 'latest'] });
  }

  function readReferrer(account) {
    return call(FARM, SEL_REFERRER + pad32(account)).then(function (r) {
      if (!r || r === '0x') return '0x0000000000000000000000000000000000000000';
      return '0x' + r.slice(-40);
    });
  }
  function readVolume(selector, account) {
    return call(FARM, selector + pad32(account)).then(function (r) {
      return r && r !== '0x' ? BigInt(r) : 0n;
    }).catch(function () { return 0n; });
  }
  function readAddress(selector, arg) {
    return call(FARM, selector + (arg ? pad32(arg) : '')).then(function (r) {
      if (!r || r === '0x') return '0x0000000000000000000000000000000000000000';
      return '0x' + r.slice(-40);
    }).catch(function () { return '0x0000000000000000000000000000000000000000'; });
  }
  function readBool(selector, arg) {
    return call(FARM, selector + pad32(arg)).then(function (r) {
      return !!(r && r !== '0x' && BigInt(r) !== 0n);
    }).catch(function () { return false; });
  }

  var el, body, statusEl, inputEl, btnEl, hintEl, teamEl, ownEl, toggleEl;
  var account = null;
  var bound = null;

  function setStatus(text, tone) {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.style.color = tone === 'ok' ? '#34d399' : tone === 'warn' ? '#fbbf24' : tone === 'err' ? '#f87171' : '#cbd5e1';
  }

  function refresh() {
    var w = wallet();
    if (!w) { setStatus('未检测到钱包，请在钱包内置浏览器打开', 'warn'); return; }
    // eth_accounts does not prompt; only bind() asks for authorization, so the
    // wallet is not popped up on every page load.
    return w.request({ method: 'eth_accounts' }).then(function (accs) {
      account = accs && accs[0] ? accs[0] : null;
      if (!account) {
        setStatus('钱包未连接 —— 绑定时会自动请求连接', 'warn');
        inputEl.disabled = false;
        btnEl.disabled = false;
        btnEl.textContent = '连接钱包并绑定';
        hintEl.textContent = '点上面的按钮会先请求钱包授权，再发起绑定交易。';
        teamEl.textContent = '-';
        ownEl.textContent = '-';
        return;
      }
      return Promise.all([readReferrer(account), readAddress(SEL_ROOT_USER)]).then(function (res) {
        var up = res[0];
        var rootUser = res[1];
        var isRoot = rootUser !== '0x0000000000000000000000000000000000000000'
          && rootUser.toLowerCase() === account.toLowerCase();
        bound = up && up !== '0x0000000000000000000000000000000000000000' ? up : null;

        if (isRoot) {
          // The network root is the one address exempt from the binding rule.
          setStatus('网络根地址（' + account.slice(0, 6) + '…' + account.slice(-4) + '）—— 无需绑定，可直接参与游戏', 'ok');
          inputEl.value = '';
          inputEl.disabled = true;
          btnEl.disabled = true;
          btnEl.textContent = '根地址无需绑定';
          hintEl.textContent = '全网第一个地址免绑定；其他地址必须先绑定一个已注册的上级。';
        } else if (bound) {
          setStatus('已绑定上级：' + bound.slice(0, 6) + '…' + bound.slice(-4), 'ok');
          inputEl.value = '';
          inputEl.disabled = true;
          btnEl.disabled = true;
          btnEl.textContent = '已绑定（不可更改）';
          hintEl.textContent = '绑定关系一经写入不可撤销，也不能改绑。';
        } else {
          setStatus('未绑定上级 —— 现在参与游戏会被拒绝', 'err');
          inputEl.disabled = false;
          btnEl.disabled = false;
          btnEl.textContent = '绑定上级';
          hintEl.textContent = '上级必须已经是树内地址（网络根地址，或已绑定过上级的地址），否则绑定会被拒绝。';
        }
        return Promise.all([
          readVolume(SEL_TEAM, account),
          readVolume(SEL_OWN_TEAM, account)
        ]).then(function (v) {
          teamEl.textContent = fmt18(v[0]);
          ownEl.textContent = fmt18(v[1]);
        });
      });
    }).catch(function (e) {
      setStatus('读取失败：' + (e && e.message ? e.message.slice(0, 40) : '未知错误'), 'err');
    });
  }

  /// Polls referrer() until the binding is visible on chain (max ~60s).
  function waitBound(target, tries) {
    if (!account) return;
    readReferrer(account).then(function (up) {
      if (up && up.toLowerCase() === String(target).toLowerCase()) {
        hintEl.textContent = '绑定成功。';
        refresh();
        return;
      }
      if (tries >= 20) {
        hintEl.textContent = '仍未检测到绑定，请稍后刷新页面确认。';
        btnEl.disabled = false;
        btnEl.textContent = '绑定上级';
        return;
      }
      hintEl.textContent = '等待上链确认…（' + (tries + 1) + '/20）';
      setTimeout(function () { waitBound(target, tries + 1); }, 3000);
    }).catch(function () {
      setTimeout(function () { waitBound(target, tries + 1); }, 3000);
    });
  }

  function bind() {
    var target = String(inputEl.value || '').trim();
    if (!isAddr(target)) { hintEl.textContent = '请输入合法的 0x 地址（40 位十六进制）。'; return; }
    var w = wallet();
    if (!w) { hintEl.textContent = '未检测到钱包。'; return; }

    btnEl.disabled = true;
    btnEl.textContent = '等待钱包确认…';
    hintEl.textContent = '';

    var ensure = account
      ? Promise.resolve(account)
      : w.request({ method: 'eth_requestAccounts' }).then(function (accs) {
          account = accs && accs[0] ? accs[0] : null;
          if (!account) throw new Error('未授权钱包账户');
          return account;
        });

    ensure.then(function (from) {
      if (target.toLowerCase() === String(from).toLowerCase()) {
        throw new Error('SelfReferrer');
      }
      return w.request({
        method: 'eth_sendTransaction',
        params: [{ from: from, to: FARM, data: SEL_SET_REFERRER + pad32(target) }]
      });
    }).then(function () {
      btnEl.textContent = '已提交，等待上链…';
      hintEl.textContent = '等待上链确认…';
      waitBound(target, 0);
    }).catch(function (e) {
      var msg = (e && (e.message || (e.data && e.data.message))) || '';
      if (/user rejected|denied/i.test(msg)) msg = '你取消了签名。';
      else if (/TooManyLegs/.test(msg)) msg = '该上级的直推人数已满 50 人（MAX_LEGS），无法再绑定。';
      else if (/UplineNotRegistered/.test(msg)) msg = '该上级还不是树内地址。请先让他绑定上级，或绑定网络根地址。';
      else if (/ReferrerAlreadySet/.test(msg)) msg = '你已经绑定过上级，不能改绑。';
      else if (/CannotBindDownline/.test(msg)) msg = '不能绑定自己的下级。';
      else if (/SelfReferrer/.test(msg)) msg = '不能绑定自己。';
      else if (/ReferrerZero/.test(msg)) msg = '上级地址不能是零地址。';
      hintEl.textContent = msg ? msg.slice(0, 120) : '绑定失败，请稍后重试。';
      btnEl.disabled = false;
      btnEl.textContent = '绑定上级';
    });
  }

  function build() {
    if (document.getElementById('ref-panel')) return;

    var css = document.createElement('style');
    css.textContent = [
      '#ref-panel{position:fixed;right:12px;bottom:12px;width:300px;z-index:2147483646;',
      'font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e2e8f0;',
      'background:rgba(15,23,42,.96);border:1px solid rgba(148,163,184,.28);border-radius:12px;',
      'box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}',
      '#ref-panel .rp-head{display:flex;align-items:center;justify-content:space-between;',
      'padding:8px 12px;background:rgba(30,41,59,.9);cursor:pointer;user-select:none}',
      '#ref-panel .rp-title{font-weight:600;font-size:12px;letter-spacing:.02em}',
      '#ref-panel .rp-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}',
      '#ref-panel.rp-collapsed .rp-body{display:none}',
      '#ref-panel .rp-status{font-size:12px;word-break:break-all}',
      '#ref-panel input{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:7px;',
      'border:1px solid rgba(148,163,184,.35);background:rgba(2,6,23,.85);color:#e2e8f0;font:12px/1.4 monospace}',
      '#ref-panel input:disabled{opacity:.55}',
      '#ref-panel button{width:100%;padding:8px;border:0;border-radius:7px;cursor:pointer;',
      'background:#0f766e;color:#fff;font-weight:600;font-size:12px}',
      '#ref-panel button:hover:not(:disabled){background:#0d9488}',
      '#ref-panel button:disabled{background:#334155;cursor:default;opacity:.8}',
      '#ref-panel .rp-hint{font-size:11px;color:#94a3b8;line-height:1.45}',
      '#ref-panel .rp-kv{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8}',
      '#ref-panel .rp-kv b{color:#e2e8f0;font-weight:600;font-variant-numeric:tabular-nums}',
      '#ref-panel .rp-sep{height:1px;background:rgba(148,163,184,.2);margin:2px 0}',
      '@media (max-width:560px){#ref-panel{width:calc(100% - 24px);left:12px;right:12px;bottom:56px}}'
    ].join('');
    document.head.appendChild(css);

    el = document.createElement('div');
    el.id = 'ref-panel';
    el.innerHTML = [
      '<div class="rp-head"><span class="rp-title">推荐关系 / 业绩</span><span id="rp-toggle">−</span></div>',
      '<div class="rp-body">',
      '<div class="rp-status" id="rp-status">正在读取…</div>',
      '<input id="rp-input" placeholder="上级钱包地址 0x…" autocomplete="off" spellcheck="false" />',
      '<button id="rp-btn" type="button">绑定上级</button>',
      '<div class="rp-hint" id="rp-hint"></div>',
      '<div class="rp-sep"></div>',
      '<div class="rp-kv"><span>团队业绩（下线）</span><b id="rp-team">-</b></div>',
      '<div class="rp-kv"><span>本人 + 团队</span><b id="rp-own">-</b></div>',
      '</div>'
    ].join('');
    document.body.appendChild(el);

    body = el.querySelector('.rp-body');
    statusEl = document.getElementById('rp-status');
    inputEl = document.getElementById('rp-input');
    btnEl = document.getElementById('rp-btn');
    hintEl = document.getElementById('rp-hint');
    teamEl = document.getElementById('rp-team');
    ownEl = document.getElementById('rp-own');
    toggleEl = document.getElementById('rp-toggle');

    // On narrow screens start collapsed so the panel does not cover the bet form.
    if (window.innerWidth && window.innerWidth < 560) {
      el.classList.add('rp-collapsed');
      toggleEl.textContent = '+';
    }
    el.querySelector('.rp-head').addEventListener('click', function () {
      var collapsed = el.classList.toggle('rp-collapsed');
      toggleEl.textContent = collapsed ? '+' : '−';
    });
    btnEl.addEventListener('click', bind);
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') bind();
    });

    var w = wallet();
    if (w && w.on) {
      w.on('accountsChanged', function () { refresh(); });
      w.on('chainChanged', function () { setTimeout(refresh, 300); });
    }
    refresh();
    setInterval(function () { if (!document.hidden) refresh(); }, 30000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();
</script>
<script>
/* ══ 开奖哈希查询 · 完整纯数字面板（移植自 shengtainongchang RulesPanel） ══════
   口径与合约 FarmGuess._parityOfLastThreeDigits / computeResult 完全一致：
     x = uint256(hash)
     x % 1000 → 十进制末三位 d2 d1 d0（不足补 0）
     sum = d2 + d1 + d0，result = sum % 2（1 = 单，0 = 双）
   十进制末三位需要全部 32 字节参与，绝不能看十六进制字符串末尾 3 个字符 ——
   两种口径在约一半哈希上结论相反，面板同时展示两种结果以便对照。
   只读换算在本地完成；「链上校验」通过 window.__FARM_ETH__ 读 computeResult，
   不发起任何交易。 */
(function () {
  'use strict';

  var FARM = '0xea8cb2d57d40dafac22b24fde661dd6b64f90848';
  var SEL_COMPUTE_RESULT = '0x27157d58'; // computeResult(bytes32)
  var EXPLORER = 'https://bscscan.com';
  var EXAMPLE_HASH = '0xfdc31a577a2af836045b653fc8fd0f3ba8d2979039d068d0dae4a95e4e1fd8a3';
  var HEX_RE = /^[0-9a-fA-F]+$/;

  var el, inputEl, outEl, toggleEl;
  var lookupSeq = 0;

  function label(p) { return p === 1 ? '单' : '双'; }

  // Any hex string (1..64 nibbles) -> full decimal. Returns null on invalid
  // input or >32 bytes; mirrors convertHex() in the source project.
  function convertHex(raw) {
    var s = String(raw == null ? '' : raw).trim().replace(/[\s,_]/g, '');
    if (!s) return null;
    var prefixed = s.slice(0, 2).toLowerCase() === '0x';
    var body = prefixed ? s.slice(2) : s;
    if (!body || !HEX_RE.test(body)) return null;
    var trimmed = body.replace(/^0+(?=.)/, '');
    if (trimmed.length > 64) return null;
    return {
      display: prefixed ? '0x' + body : body,
      body: trimmed || '0',
      decimal: BigInt('0x' + (trimmed || '0')).toString(),
      nibbles: body.length,
      bytes: Math.ceil(body.length / 2),
      isHash: body.length === 64
    };
  }

  // Full breakdown of one 32-byte draw hash, including the hex-tail misreading.
  function analyzeHash(hash) {
    var body = hash.toLowerCase().replace(/^0x/, '');
    var x = BigInt('0x' + body);
    var lastThree = (x % 1000n).toString().padStart(3, '0');
    var hundreds = Number(lastThree[0]);
    var tens = Number(lastThree[1]);
    var units = Number(lastThree[2]);
    var sum = hundreds + tens + units;
    var parity = sum % 2;

    var hexTail = body.slice(-3);
    var hexSum = hexTail.split('').reduce(function (a, ch) { return a + parseInt(ch, 16); }, 0);
    var hexParity = hexSum % 2;

    return {
      hash: '0x' + body,
      lastThree: lastThree,
      hundreds: hundreds, tens: tens, units: units,
      sum: sum,
      parity: parity,
      resultLabel: label(parity),
      hexTail: hexTail,
      hexSum: hexSum,
      hexLabel: label(hexParity),
      hexDiffers: hexParity !== parity
    };
  }

  function pad64(hex) {
    return hex.toLowerCase().replace(/^0x/, '').padStart(64, '0');
  }

  function eth() { return window.__FARM_ETH__ || window.ethereum || null; }

  function readOnChain(hash, cb) {
    var e = eth();
    if (!e) { cb({ status: 'error', message: '未连接 RPC，本地换算不受影响' }); return; }
    var data = SEL_COMPUTE_RESULT + pad64(hash);
    e.request({ method: 'eth_call', params: [{ to: FARM, data: data }, 'latest'] })
      .then(function (r) {
        if (!r || r === '0x') throw new Error('合约无返回值');
        var value = Number(BigInt(r));
        return e.request({ method: 'eth_getBlockByHash', params: [hash.toLowerCase(), false] })
          .then(function (blk) {
            var num = blk && blk.number ? parseInt(blk.number, 16) : null;
            cb({ status: 'ok', value: value, blockNumber: num });
          });
      })
      .catch(function (err) {
        cb({ status: 'error', message: (err && err.message ? err.message : String(err)).slice(0, 100) });
      });
  }

  function h(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function kv(labelText, valueNode, accent) {
    var block = h('div', 'hp-kv' + (accent ? ' hp-kv--accent' : ''));
    block.appendChild(h('span', 'hp-kv-label', labelText));
    block.appendChild(valueNode);
    return block;
  }

  function render(input) {
    outEl.innerHTML = '';
    var invalid = input.trim().length > 0 && convertHex(input) === null;
    if (invalid) {
      outEl.appendChild(h('div', 'hp-notice hp-notice--err',
        '不是合法的十六进制：只能包含 0-9 与 a-f，最多 64 位（32 字节）。'));
      return;
    }
    if (!input.trim()) {
      outEl.appendChild(h('div', 'hp-notice',
        '在上方输入或粘贴十六进制，十进制结果会立刻显示在这里。'));
      return;
    }

    var c = convertHex(input);
    if (!c) return;

    var hexNode = h('code', 'hp-mono hp-full', c.display);
    var decNode = h('code', 'hp-mono hp-full hp-decimal', c.decimal);
    decNode.setAttribute('data-testid', 'decimal-value');
    outEl.appendChild(kv(c.isHash ? '开奖哈希（十六进制）' : '十六进制输入（' + c.nibbles + ' 位 · ' + c.bytes + ' 字节）', hexNode));
    outEl.appendChild(kv(c.isHash ? '开奖哈希 → 十进制（完整数字）' : '十进制（完整纯数字）', decNode, true));

    if (!c.isHash) {
      outEl.appendChild(h('div', 'hp-notice',
        '已转换为十进制。当前输入 ' + c.nibbles + ' 位十六进制（' + c.bytes +
        ' 字节），不是 32 字节区块哈希，因此不计算单双。补足到 64 位即可显示开奖结果。'));
      return;
    }

    var a = analyzeHash(c.body);

    // 状态行：通过 eth_getBlockByHash 自动确认该哈希是否为本链真实区块。
    var statusRow = h('div', 'hp-row');
    statusRow.appendChild(h('span', null, '结果状态'));
    statusRow.appendChild(h('b', null, '查询区块中…'));
    outEl.appendChild(statusRow);

    var blockNum = null;
    function applyBlock(num) {
      blockNum = num;
      if (num != null) {
        statusRow.replaceChild(h('b', 'hp-accent', '结果已上链（区块 #' + num + '）'), statusRow.lastChild);
        linkTail.textContent = '（区块 #' + num + '）';
      } else {
        statusRow.replaceChild(h('b', 'hp-warn', '未找到该区块（非本网络哈希或尚未生成）'), statusRow.lastChild);
      }
    }

    // 开奖结果：单（528 → 15）—— 末三位 → 三位之和
    var resRow = h('div', 'hp-row');
    resRow.appendChild(h('span', null, '开奖结果'));
    resRow.appendChild(h('b', a.parity === 1 ? 'hp-accent' : 'hp-info',
      a.resultLabel + '（' + a.lastThree + ' → ' + a.sum + '）'));
    outEl.appendChild(resRow);

    var row = h('div', 'hp-row');
    row.appendChild(h('span', null, '三位相加'));
    row.appendChild(h('b', null, '百 ' + a.hundreds + ' + 十 ' + a.tens + ' + 个 ' + a.units + ' = ' + a.sum));
    outEl.appendChild(row);

    var linkNode = h('a', 'hp-mono hp-full hp-link', EXPLORER + '/block/' + a.hash);
    linkNode.href = EXPLORER + '/block/' + a.hash;
    linkNode.target = '_blank';
    linkNode.rel = 'noreferrer';
    var linkTail = h('b', 'hp-mono', '');
    var linkRow = h('div', 'hp-row hp-row--top');
    linkRow.appendChild(h('span', null, '开奖区块链接'));
    var linkWrap = h('div', 'hp-linkwrap');
    linkWrap.appendChild(linkNode);
    linkWrap.appendChild(linkTail);
    linkRow.appendChild(linkWrap);
    outEl.appendChild(linkRow);

    row = h('div', 'hp-row');
    row.appendChild(h('span', null, '常见误读：十六进制末 3 字符'));
    row.appendChild(h('b', 'hp-dim', a.hexTail + ' → ' + a.hexSum + ' → ' + a.hexLabel));
    outEl.appendChild(row);

    if (a.hexDiffers) {
      outEl.appendChild(h('div', 'hp-notice hp-notice--warn',
        '按十六进制末 3 字符会得到「' + a.hexLabel + '」，与合约口径「' + a.resultLabel +
        '」不同。合约只看十进制末三位，请以上面的开奖结果为准。'));
    }

    // 自动查块：只读 eth_getBlockByHash，无需钱包。
    (function () {
      var e = eth();
      if (!e) { statusRow.replaceChild(h('b', 'hp-warn', '未连接 RPC，无法确认上链状态'), statusRow.lastChild); return; }
      var seq = ++lookupSeq;
      e.request({ method: 'eth_getBlockByHash', params: [a.hash, false] })
        .then(function (blk) {
          if (lookupSeq !== seq) return;
          applyBlock(blk && blk.number ? parseInt(blk.number, 16) : null);
        })
        .catch(function () {
          if (lookupSeq === seq) applyBlock(null);
        });
    })();

    // 可选：调合约 computeResult 交叉验证本地单双结论。
    var chainNode = h('div', 'hp-row');
    chainNode.appendChild(h('span', null, '链上 computeResult'));
    chainNode.appendChild(h('b', null, '未校验'));
    outEl.appendChild(chainNode);

    var btn = h('button', 'hp-verify', '链上校验 computeResult（可选）');
    btn.type = 'button';
    outEl.appendChild(btn);
    btn.addEventListener('click', function () {
      btn.disabled = true;
      btn.textContent = '校验中...';
      readOnChain(a.hash, function (res2) {
        btn.disabled = false;
        btn.textContent = '链上校验 computeResult（可选）';
        if (res2.status === 'ok') {
          var ok = res2.value === a.parity;
          chainNode.replaceChild(
            h('b', ok ? 'hp-accent' : 'hp-err',
              res2.value + ' · ' + (ok ? '与本地计算一致' : '与本地计算不一致')),
            chainNode.lastChild);
        } else {
          chainNode.replaceChild(h('b', 'hp-err', res2.message), chainNode.lastChild);
        }
      });
    });
  }

  function build() {
    if (document.getElementById('hash-panel')) return;

    var css = document.createElement('style');
    css.textContent = [
      '#hash-panel{position:fixed;left:12px;bottom:52px;width:340px;z-index:2147483646;',
      'font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e2e8f0;',
      'background:rgba(15,23,42,.96);border:1px solid rgba(148,163,184,.28);border-radius:12px;',
      'box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}',
      '#hash-panel .hp-head{display:flex;align-items:center;justify-content:space-between;',
      'padding:8px 12px;background:rgba(30,41,59,.9);cursor:pointer;user-select:none}',
      '#hash-panel .hp-title{font-weight:600;font-size:12px;letter-spacing:.02em}',
      '#hash-panel.rp-collapsed .hp-body{display:none}',
      '#hash-panel .hp-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}',
      '#hash-panel input{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:7px;',
      'border:1px solid rgba(148,163,184,.35);background:rgba(2,6,23,.85);color:#e2e8f0;',
      'font:12px/1.4 monospace}',
      '#hash-panel .hp-actions{display:flex;gap:6px}',
      '#hash-panel .hp-example{flex:0 0 auto;padding:6px 10px;border:0;border-radius:7px;cursor:pointer;',
      'background:#334155;color:#e2e8f0;font-weight:600;font-size:11px}',
      '#hash-panel .hp-example:hover{background:#475569}',
      '#hash-panel .hp-verify{width:100%;padding:8px;border:0;border-radius:7px;cursor:pointer;',
      'background:rgba(15,118,110,.35);color:#7dd3fc;border:1px solid rgba(125,211,252,.35);',
      'font-weight:600;font-size:12px}',
      '#hash-panel .hp-verify:hover:not(:disabled){background:rgba(15,118,110,.55)}',
      '#hash-panel .hp-verify:disabled{opacity:.6;cursor:default}',
      '#hash-panel .hp-kv{display:flex;flex-direction:column;gap:3px}',
      '#hash-panel .hp-kv-label{font-size:11px;color:#94a3b8}',
      '#hash-panel .hp-kv--accent .hp-kv-label{color:#7dd3fc}',
      '#hash-panel .hp-kv--accent .hp-decimal{color:#7dd3fc;border-color:rgba(125,211,252,.4)}',
      '#hash-panel .hp-full{word-break:break-all;white-space:pre-wrap;display:block}',
      '#hash-panel .hp-mono{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;',
      'color:#e2e8f0;font-weight:400}',
      '#hash-panel .hp-decimal{padding:6px 8px;border:1px solid rgba(148,163,184,.25);',
      'border-radius:6px;background:rgba(2,6,23,.6);max-height:120px;overflow:auto}',
      '#hash-panel .hp-link{color:#7dd3fc;text-decoration:none}',
      '#hash-panel .hp-link:hover{text-decoration:underline}',
      '#hash-panel .hp-row--top{align-items:flex-start}',
      '#hash-panel .hp-linkwrap{display:flex;flex-direction:column;gap:2px;align-items:flex-end;',
      'min-width:0;text-align:right}',
      '#hash-panel .hp-warn{color:#fbbf24}',
      '#hash-panel .hp-notice{font-size:11px;color:#94a3b8;line-height:1.5;',
      'padding:6px 8px;border-radius:6px;background:rgba(2,6,23,.5)}',
      '#hash-panel .hp-notice--err{color:#f87171}',
      '#hash-panel .hp-notice--warn{color:#fbbf24}',
      '#hash-panel .hp-row{display:flex;justify-content:space-between;gap:8px;',
      'font-size:11px;color:#94a3b8;align-items:baseline}',
      '#hash-panel .hp-row b{color:#e2e8f0;font-weight:600;font-variant-numeric:tabular-nums;',
      'text-align:right;word-break:break-all}',
      '#hash-panel .hp-accent{color:#34d399}',
      '#hash-panel .hp-info{color:#7dd3fc}',
      '#hash-panel .hp-err{color:#f87171}',
      '#hash-panel .hp-dim{color:#94a3b8;font-weight:400}',
      '#hash-panel .hp-sep{height:1px;background:rgba(148,163,184,.2);margin:2px 0}',
      '@media (max-width:560px){#hash-panel{width:calc(100% - 24px);left:12px;right:12px}}'
    ].join('');
    document.head.appendChild(css);

    el = document.createElement('div');
    el.id = 'hash-panel';
    el.innerHTML = [
      '<div class="hp-head"><span class="hp-title">开奖哈希查询 · 纯数字换算</span><span id="hp-toggle">−</span></div>',
      '<div class="hp-body">',
      '<div class="hp-actions">',
      '<input id="hp-input" placeholder="粘贴十六进制，例如 0xad5e… 或任意长度 0x1f" autocomplete="off" spellcheck="false" />',
      '<button id="hp-example" class="hp-example" type="button">示例</button>',
      '</div>',
      '<div id="hp-out"></div>',
      '</div>'
    ].join('');
    document.body.appendChild(el);

    inputEl = document.getElementById('hp-input');
    outEl = document.getElementById('hp-out');
    toggleEl = document.getElementById('hp-toggle');

    // Live conversion on every keystroke, no button needed.
    inputEl.addEventListener('input', function () { render(inputEl.value); });
    document.getElementById('hp-example').addEventListener('click', function () {
      inputEl.value = EXAMPLE_HASH;
      render(inputEl.value);
    });

    // On narrow screens start collapsed so the panel does not cover the bet form.
    if (window.innerWidth && window.innerWidth < 560) {
      el.classList.add('rp-collapsed');
      toggleEl.textContent = '+';
    }
    el.querySelector('.hp-head').addEventListener('click', function () {
      var collapsed = el.classList.toggle('rp-collapsed');
      toggleEl.textContent = collapsed ? '+' : '−';
    });

    /* ── 移动端浮动面板避让 ───────────────────────────────────────────────
       <560px 时推荐关系面板(#ref-panel, bottom:56px)与本面板都会变成全宽并
       相互重叠。这里让本面板动态抬升到推荐关系面板顶部之上，固定留 10px 间隔；
       桌面端两面板分居左右，不重叠，恢复 CSS 默认 bottom:52px。
       监听 ResizeObserver：推荐面板展开/折叠、内容变化都会触发重排。 */
    function layoutStack() {
      var ref = document.getElementById('ref-panel');
      if (!ref) return;
      var mobile = window.innerWidth <= 560;
      if (!mobile) {
        el.style.bottom = '';
        return;
      }
      // ref-panel 自身在移动端 bottom:56px，返回主页按钮再在它下面。
      var refBottom = 56;
      var top = refBottom + ref.offsetHeight + 10;
      el.style.bottom = top + 'px';
    }

    var refPanelNow = document.getElementById('ref-panel');
    if (refPanelNow && typeof ResizeObserver === 'function') {
      new ResizeObserver(layoutStack).observe(refPanelNow);
    }
    window.addEventListener('resize', layoutStack);
    layoutStack();

    render('');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();
</script>
<script>
/* ══ 我的记录 · 开奖结果直接展示（DOM 层增强） ═══════════════════════════════
   React 产物里每条记录只显示截断的揭晓哈希链接。这里用 MutationObserver 监听
   「我的记录」列表，对每张 .bet 卡片在其后追加完整开奖结果块：
     开奖结果   单（528 → 15）        ← 十进制末三位 → 三位之和，与合约 computeResult 一致
     十进制（完整数字）  3084508734…528
     开奖区块   #132351572（链接到 BscScan）
   区块号通过 __FARM_ETH__ 只读 eth_getBlockByHash 查询并缓存；本地换算永不依赖网络。
   ⚠️ React 会管理 .bet 的子节点，因此结果块挂在 <article class="bet"> 自身上，
   并用 data 标记防止重复注入；React 重渲染删掉后观察器会自动补回。 */
(function () {
  'use strict';

  var EXPLORER = 'https://bscscan.com';
  var HEX_RE = /^[0-9a-fA-F]+$/;
  var MARK = 'hpBetResult';
  var blockCache = {};
  var inflight = {};

  function eth() { return window.__FARM_ETH__ || window.ethereum || null; }

  function analyze(body) {
    var x = BigInt('0x' + body);
    var lastThree = (x % 1000n).toString().padStart(3, '0');
    var sum = Number(lastThree[0]) + Number(lastThree[1]) + Number(lastThree[2]);
    return { lastThree: lastThree, sum: sum, parity: sum % 2, label: sum % 2 === 1 ? '单' : '双' };
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function row(label, valueNode) {
    var r = el('div', 'hp-bet-row');
    r.appendChild(el('span', 'hp-bet-label', label));
    r.appendChild(valueNode);
    return r;
  }

  function setBlock(article, hash, num) {
    var box = article.querySelector('.hp-bet-result');
    if (!box) return;
    var node = box.querySelector('.hp-bet-block b');
    if (!node) return;
    if (num != null) {
      node.textContent = '#' + num;
      node.classList.add('hp-bet-ok');
    } else {
      node.textContent = '未找到区块';
      node.classList.add('hp-bet-warn');
    }
  }

  function lookupBlock(article, hash) {
    if (blockCache[hash] !== undefined) { setBlock(article, hash, blockCache[hash]); return; }
    if (inflight[hash]) { inflight[hash].push(article); return; }
    var waiters = [article];
    inflight[hash] = waiters;
    var e = eth();
    if (!e) {
      delete inflight[hash];
      waiters.forEach(function (a) { setBlock(a, hash, null); });
      return;
    }
    e.request({ method: 'eth_getBlockByHash', params: [hash, false] })
      .then(function (blk) {
        var num = blk && blk.number ? parseInt(blk.number, 16) : null;
        blockCache[hash] = num;
        delete inflight[hash];
        waiters.forEach(function (a) { setBlock(a, hash, num); });
      })
      .catch(function () {
        delete inflight[hash];
        waiters.forEach(function (a) { setBlock(a, hash, null); });
      });
  }

  function decorate(article) {
    var link = article.querySelector('.bet-meta a[href*="/block/0x"]');
    if (!link) return;
    var m = (link.getAttribute('href') || '').match(/0x[0-9a-fA-F]{64}/);
    if (!m) return;
    var hash = m[0];
    var body = hash.slice(2).toLowerCase();
    if (!HEX_RE.test(body) || body.length !== 64) return;
    if (article.getAttribute(MARK) === hash) return;
    article.setAttribute(MARK, hash);

    var a = analyze(body);

    var box = el('div', 'hp-bet-result');
    var res = el('b', a.parity === 1 ? 'hp-bet-odd' : 'hp-bet-even',
      a.label + '（' + a.lastThree + ' → ' + a.sum + '）');
    box.appendChild(row('开奖结果', res));

    var dec = el('code', 'hp-bet-decimal mono', BigInt('0x' + body).toString());
    box.appendChild(row('开奖哈希 → 十进制（完整数字）', dec));

    var blockWrap = el('span', 'hp-bet-block');
    var blockLink = el('a', 'mono hp-bet-hashlink', hash);
    blockLink.href = EXPLORER + '/block/' + hash;
    blockLink.target = '_blank';
    blockLink.rel = 'noreferrer';
    blockLink.title = '在区块浏览器中查看开奖区块';
    blockWrap.appendChild(blockLink);
    blockWrap.appendChild(el('b', null, ' 查询区块中…'));
    box.appendChild(row('开奖区块', blockWrap));

    article.appendChild(box);
    lookupBlock(article, hash);
  }

  function scan() {
    var cards = document.querySelectorAll('article.bet');
    for (var i = 0; i < cards.length; i++) decorate(cards[i]);
  }

  var css = document.createElement('style');
  css.textContent = [
    '.hp-bet-result{margin-top:8px;padding:8px 10px;border:1px solid rgba(148,163,184,.22);',
    'border-radius:8px;background:rgba(2,6,23,.45);display:flex;flex-direction:column;gap:5px}',

  var pending = null;
  var mo = new MutationObserver(function () {
    if (pending) return;
    pending = requestAnimationFrame(function () { pending = null; scan(); });
  });

  function start() {
    mo.observe(document.body, { childList: true, subtree: true });
    scan();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
