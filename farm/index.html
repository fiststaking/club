/* ══ BSC RPC 通道白名单 + 自动故障转移 ══════════════════════════════════════
   通道来源: warstaking 实测白名单 (国内直连优先, 海外镜像兜底), 已逐个实测
   eth_chainId == 0x38。策略与上游一致: 并行探测延迟 → 升序排名 → 失败自动切下一通道。
   ⚠️ 避坑: 原产物把 RPC 写死为单个 bsc-dataseed.binance.org 且回退到自己(等于无回退),
      该节点按 IP 限流, 一旦抖动整页读不出数据。此处仅接管「只读」调用;
      参与游戏/授权/签名等写操作仍然走 window.ethereum, 私钥与签名不离开钱包。 */
(function () {
  'use strict';
  var CHAIN_ID = '0x38';
  var PROBE_MS = 2500;
  var CALL_MS = 8000;
  var BAD_MS = 60000;
  var CACHE_KEY = 'fistfarm.rpc.rank.v1';
  var CACHE_TTL = 5 * 60 * 1000;

  var ENDPOINTS = [
    { n: 'TokenPocket', u: 'https://bsc.mytokenpocket.vip' },
    { n: '48Club',      u: 'https://rpc-bsc.48.club' },
    { n: 'BNB Chain',   u: 'https://bsc-dataseed.bnbchain.org' },
    { n: 'defibit2',    u: 'https://bsc-dataseed2.defibit.io' },
    { n: 'defibit3',    u: 'https://bsc-dataseed3.defibit.io' },
    { n: 'defibit4',    u: 'https://bsc-dataseed4.defibit.io' },
    { n: '1RPC',        u: 'https://1rpc.io/bnb' },
    { n: 'PublicNode',  u: 'https://bsc-rpc.publicnode.com' },
    { n: 'BlastAPI',    u: 'https://bsc-mainnet.public.blastapi.io' },
    { n: 'MeowRPC',     u: 'https://bsc.meowrpc.com' }
  ];
  var NAME = {};
  ENDPOINTS.forEach(function (e) { NAME[e.u] = e.n; });
  var ALL = ENDPOINTS.map(function (e) { return e.u; });

  var bad = {};
  var order = null;
  var ranking = null;
  var seq = 1;

  function now() { return Date.now(); }
  function isBad(u) { return bad[u] && bad[u] > now(); }
  function rank0() { return (window.performance && window.performance.now) ? window.performance.now() : now(); }

  function rpc(url, method, params, ms) {
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { try { ctl.abort(); } catch (_) {} }, ms) : null;
    var opts = {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: seq++, method: method, params: params || [] })
    };
    if (ctl) opts.signal = ctl.signal;
    return fetch(url, opts).then(function (res) {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.transport = true; throw e; }
      return res.json();
    }).then(function (json) {
      if (json && json.error) {
        var e2 = new Error(json.error.message || 'RPC error');
        e2.rpcError = true;
        e2.code = json.error.code;
        e2.data = json.error.data;
        throw e2;
      }
      return json ? json.result : undefined;
    }).catch(function (e) {
      if (timer) { clearTimeout(timer); timer = null; }
      if (e && !e.rpcError) e.transport = true;
      throw e;
    });
  }

  function restore() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.t || (now() - o.t) > CACHE_TTL) return null;
      if (!Array.isArray(o.o)) return null;
      var list = o.o.filter(function (u) { return NAME[u]; });
      return list.length ? list : null;
    } catch (_) { return null; }
  }

  function persist(list) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: now(), o: list })); } catch (_) {}
  }

  function rank() {
    if (ranking) return ranking;
    ranking = Promise.all(ENDPOINTS.map(function (e) {
      var t0 = rank0();
      return rpc(e.u, 'eth_chainId', [], PROBE_MS).then(function (id) {
        if (String(id).toLowerCase() !== CHAIN_ID) return null;
        return { u: e.u, ms: rank0() - t0 };
      }).catch(function () { return null; });
    })).then(function (rs) {
      var ok = rs.filter(Boolean).sort(function (a, b) { return a.ms - b.ms; });
      var list = ok.map(function (x) { return x.u; });
      ALL.forEach(function (u) { if (list.indexOf(u) < 0) list.push(u); });
      order = list;
      persist(list);
      ranking = null;
      sync();
      return list;
    }).catch(function () { ranking = null; return current(); });
    return ranking;
  }

  function current() { return order || restore() || ALL; }

  function send(method, params) {
    var list = current().filter(function (u) { return !isBad(u); });
    if (!list.length) list = current();
    var i = 0;
    function step() {
      if (i >= list.length) {
        var e = new Error('所有 RPC 通道均不可用');
        e.transport = true;
        return Promise.reject(e);
      }
      var url = list[i++];
      return rpc(url, method, params, CALL_MS).then(function (r) {
        return r;
      }, function (err) {
        if (err && err.rpcError) throw err;
        bad[url] = now() + BAD_MS;
        return step();
      });
    }
    return step();
  }

  var WALLET_ONLY = /^(eth_requestAccounts|eth_accounts|eth_sendTransaction|eth_sendRawTransaction|eth_sign|personal_sign|eth_signTypedData.*|wallet_.*|eth_subscribe|eth_unsubscribe)$/i;

  var shim = {
    isFarmRpcShim: true,
    request: function (payload) {
      var method = (payload && payload.method) ? String(payload.method) : '';
      var params = (payload && payload.params) || [];
      if (WALLET_ONLY.test(method)) {
        if (window.ethereum && window.ethereum !== shim && typeof window.ethereum.request === 'function') {
          return window.ethereum.request(payload);
        }
        return Promise.reject(new Error('该操作需要钱包: ' + method));
      }
      return send(method, params);
    }
  };

  function sync() { window.__FARM_RPC_LIST__ = current(); }

  window.__FARM_ETH__ = shim;
  window.__FARM_RPC_STATUS__ = function () {
    return {
      order: current().map(function (u) { return NAME[u] || u; }),
      bad: Object.keys(bad).filter(isBad).map(function (u) { return NAME[u] || u; })
    };
  };
  sync();
  rank();
  setInterval(rank, 120000);
})();
</script>

/* ══ 推荐关系绑定面板 ══════════════════════════════════════════════════════
   为什么需要这个面板：新版 FarmGuess 的 placeBet() 强制要求 referrer != 0，
   未绑定的地址参与游戏会直接 revert ReferrerRequired()。而 React 产物里没有绑定入口，
   所以这里补一个独立面板（只做 setReferrer / referrer 两个调用，不碰游戏逻辑）。

   读写通道：
     - 读  referrer(address) / 业绩  走 window.__FARM_ETH__（10 通道故障转移池）
     - 写  setReferrer(address)      走 window.ethereum（私钥不离开钱包）
   ⚠️ 避坑：不要用 __FARM_ETH__ 发 eth_sendTransaction 以外的自定义方法；shim 只把
      钱包专属方法（含 eth_sendTransaction）透传给 window.ethereum。 */
(function () {
  'use strict';

  var FARM = '0xea8cb2d57d40dafac22b24fde661dd6b64f90848';
  var SEL_SET_REFERRER = '0xa18a7bfc';   // setReferrer(address)
  var SEL_REFERRER = '0x2cf003c2';       // referrer(address)
  var SEL_TEAM = '0x615f36a9';           // getTeamVolume(address)         下线业绩
  var SEL_OWN_TEAM = '0x9933e53b';       // getPersonalPlusTeamVolume(address) 本人+下线
  var SEL_ROOT_USER = '0xaa3763f7';      // rootUser()  网络根地址，免绑定
  var SEL_IS_REGISTERED = '0xc3c5a547';  // isRegistered(address) 是否已在树内

  function eth() {
    return window.__FARM_ETH__ || window.ethereum || null;
  }
  function wallet() {
    return window.ethereum || null;
  }
  function pad32(addr) {
    return String(addr).toLowerCase().replace(/^0x/, '').padStart(64, '0');
  }
  function isAddr(s) {
    return /^0x[0-9a-fA-F]{40}$/.test(String(s || '').trim());
  }
  function fmt18(hexOrBig) {
    try {
      var v = typeof hexOrBig === 'bigint' ? hexOrBig : BigInt(hexOrBig);
      var whole = v / 1000000000000000000n;
      var frac = (v % 1000000000000000000n).toString().padStart(18, '0').slice(0, 4);
      return whole.toString() + '.' + frac;
    } catch (e) { return '-'; }
  }

  function call(to, data) {
    var e = eth();
    if (!e) return Promise.reject(new Error('RPC 不可用'));
    return e.request({ method: 'eth_call', params: [{ to: to, data: data }, 'latest'] });
  }

  function readReferrer(account) {
    return call(FARM, SEL_REFERRER + pad32(account)).then(function (r) {
      if (!r || r === '0x') return '0x0000000000000000000000000000000000000000';
      return '0x' + r.slice(-40);
    });
  }
  function readVolume(selector, account) {
    return call(FARM, selector + pad32(account)).then(function (r) {
      return r && r !== '0x' ? BigInt(r) : 0n;
    }).catch(function () { return 0n; });
  }
  function readAddress(selector, arg) {
    return call(FARM, selector + (arg ? pad32(arg) : '')).then(function (r) {
      if (!r || r === '0x') return '0x0000000000000000000000000000000000000000';
      return '0x' + r.slice(-40);
    }).catch(function () { return '0x0000000000000000000000000000000000000000'; });
  }
  function readBool(selector, arg) {
    return call(FARM, selector + pad32(arg)).then(function (r) {
      return !!(r && r !== '0x' && BigInt(r) !== 0n);
    }).catch(function () { return false; });
  }

  var el, body, statusEl, inputEl, btnEl, hintEl, teamEl, ownEl, toggleEl;
  var account = null;
  var bound = null;

  function setStatus(text, tone) {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.style.color = tone === 'ok' ? '#34d399' : tone === 'warn' ? '#fbbf24' : tone === 'err' ? '#f87171' : '#cbd5e1';
  }

  function refresh() {
    var w = wallet();
    if (!w) { setStatus('未检测到钱包，请在钱包内置浏览器打开', 'warn'); return; }
    // eth_accounts does not prompt; only bind() asks for authorization, so the
    // wallet is not popped up on every page load.
    return w.request({ method: 'eth_accounts' }).then(function (accs) {
      account = accs && accs[0] ? accs[0] : null;
      if (!account) {
        setStatus('钱包未连接 —— 绑定时会自动请求连接', 'warn');
        inputEl.disabled = false;
        btnEl.disabled = false;
        btnEl.textContent = '连接钱包并绑定';
        hintEl.textContent = '点上面的按钮会先请求钱包授权，再发起绑定交易。';
        teamEl.textContent = '-';
        ownEl.textContent = '-';
        return;
      }
      return Promise.all([readReferrer(account), readAddress(SEL_ROOT_USER)]).then(function (res) {
        var up = res[0];
        var rootUser = res[1];
        var isRoot = rootUser !== '0x0000000000000000000000000000000000000000'
          && rootUser.toLowerCase() === account.toLowerCase();
        bound = up && up !== '0x0000000000000000000000000000000000000000' ? up : null;

        if (isRoot) {
          // The network root is the one address exempt from the binding rule.
          setStatus('网络根地址（' + account.slice(0, 6) + '…' + account.slice(-4) + '）—— 无需绑定，可直接参与游戏', 'ok');
          inputEl.value = '';
          inputEl.disabled = true;
          btnEl.disabled = true;
          btnEl.textContent = '根地址无需绑定';
          hintEl.textContent = '全网第一个地址免绑定；其他地址必须先绑定一个已注册的上级。';
        } else if (bound) {
          setStatus('已绑定上级：' + bound.slice(0, 6) + '…' + bound.slice(-4), 'ok');
          inputEl.value = '';
          inputEl.disabled = true;
          btnEl.disabled = true;
          btnEl.textContent = '已绑定（不可更改）';
          hintEl.textContent = '绑定关系一经写入不可撤销，也不能改绑。';
        } else {
          setStatus('未绑定上级 —— 现在参与游戏会被拒绝', 'err');
          inputEl.disabled = false;
          btnEl.disabled = false;
          btnEl.textContent = '绑定上级';
          hintEl.textContent = '上级必须已经是树内地址（网络根地址，或已绑定过上级的地址），否则绑定会被拒绝。';
        }
        return Promise.all([
          readVolume(SEL_TEAM, account),
          readVolume(SEL_OWN_TEAM, account)
        ]).then(function (v) {
          teamEl.textContent = fmt18(v[0]);
          ownEl.textContent = fmt18(v[1]);
        });
      });
    }).catch(function (e) {
      setStatus('读取失败：' + (e && e.message ? e.message.slice(0, 40) : '未知错误'), 'err');
    });
  }

  /// Polls referrer() until the binding is visible on chain (max ~60s).
  function waitBound(target, tries) {
    if (!account) return;
    readReferrer(account).then(function (up) {
      if (up && up.toLowerCase() === String(target).toLowerCase()) {
        hintEl.textContent = '绑定成功。';
        refresh();
        return;
      }
      if (tries >= 20) {
        hintEl.textContent = '仍未检测到绑定，请稍后刷新页面确认。';
        btnEl.disabled = false;
        btnEl.textContent = '绑定上级';
        return;
      }
      hintEl.textContent = '等待上链确认…（' + (tries + 1) + '/20）';
      setTimeout(function () { waitBound(target, tries + 1); }, 3000);
    }).catch(function () {
      setTimeout(function () { waitBound(target, tries + 1); }, 3000);
    });
  }

  function bind() {
    var target = String(inputEl.value || '').trim();
    if (!isAddr(target)) { hintEl.textContent = '请输入合法的 0x 地址（40 位十六进制）。'; return; }
    var w = wallet();
    if (!w) { hintEl.textContent = '未检测到钱包。'; return; }

    btnEl.disabled = true;
    btnEl.textContent = '等待钱包确认…';
    hintEl.textContent = '';

    var ensure = account
      ? Promise.resolve(account)
      : w.request({ method: 'eth_requestAccounts' }).then(function (accs) {
          account = accs && accs[0] ? accs[0] : null;
          if (!account) throw new Error('未授权钱包账户');
          return account;
        });

    ensure.then(function (from) {
      if (target.toLowerCase() === String(from).toLowerCase()) {
        throw new Error('SelfReferrer');
      }
      return w.request({
        method: 'eth_sendTransaction',
        params: [{ from: from, to: FARM, data: SEL_SET_REFERRER + pad32(target) }]
      });
    }).then(function () {
      btnEl.textContent = '已提交，等待上链…';
      hintEl.textContent = '等待上链确认…';
      waitBound(target, 0);
    }).catch(function (e) {
      var msg = (e && (e.message || (e.data && e.data.message))) || '';
      if (/user rejected|denied/i.test(msg)) msg = '你取消了签名。';
      else if (/TooManyLegs/.test(msg)) msg = '该上级的直推人数已满 50 人（MAX_LEGS），无法再绑定。';
      else if (/UplineNotRegistered/.test(msg)) msg = '该上级还不是树内地址。请先让他绑定上级，或绑定网络根地址。';
      else if (/ReferrerAlreadySet/.test(msg)) msg = '你已经绑定过上级，不能改绑。';
      else if (/CannotBindDownline/.test(msg)) msg = '不能绑定自己的下级。';
      else if (/SelfReferrer/.test(msg)) msg = '不能绑定自己。';
      else if (/ReferrerZero/.test(msg)) msg = '上级地址不能是零地址。';
      hintEl.textContent = msg ? msg.slice(0, 120) : '绑定失败，请稍后重试。';
      btnEl.disabled = false;
      btnEl.textContent = '绑定上级';
    });
  }

  function build() {
    if (document.getElementById('ref-panel')) return;

    var css = document.createElement('style');
    css.textContent = [
      '#ref-panel{position:fixed;right:12px;bottom:12px;width:300px;z-index:2147483646;',
      'font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e2e8f0;',
      'background:rgba(15,23,42,.96);border:1px solid rgba(148,163,184,.28);border-radius:12px;',
      'box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}',
      '#ref-panel .rp-head{display:flex;align-items:center;justify-content:space-between;',
      'padding:8px 12px;background:rgba(30,41,59,.9);cursor:pointer;user-select:none}',
      '#ref-panel .rp-title{font-weight:600;font-size:12px;letter-spacing:.02em}',
      '#ref-panel .rp-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}',
      '#ref-panel.rp-collapsed .rp-body{display:none}',
      '#ref-panel .rp-status{font-size:12px;word-break:break-all}',
      '#ref-panel input{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:7px;',
      'border:1px solid rgba(148,163,184,.35);background:rgba(2,6,23,.85);color:#e2e8f0;font:12px/1.4 monospace}',
      '#ref-panel input:disabled{opacity:.55}',
      '#ref-panel button{width:100%;padding:8px;border:0;border-radius:7px;cursor:pointer;',
      'background:#0f766e;color:#fff;font-weight:600;font-size:12px}',
      '#ref-panel button:hover:not(:disabled){background:#0d9488}',
      '#ref-panel button:disabled{background:#334155;cursor:default;opacity:.8}',
      '#ref-panel .rp-hint{font-size:11px;color:#94a3b8;line-height:1.45}',
      '#ref-panel .rp-kv{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8}',
      '#ref-panel .rp-kv b{color:#e2e8f0;font-weight:600;font-variant-numeric:tabular-nums}',
      '#ref-panel .rp-sep{height:1px;background:rgba(148,163,184,.2);margin:2px 0}',
      '@media (max-width:560px){#ref-panel{width:calc(100% - 24px);left:12px;right:12px;bottom:56px}}'
    ].join('');
    document.head.appendChild(css);

    el = document.createElement('div');
    el.id = 'ref-panel';
    el.innerHTML = [
      '<div class="rp-head"><span class="rp-title">推荐关系 / 业绩</span><span id="rp-toggle">−</span></div>',
      '<div class="rp-body">',
      '<div class="rp-status" id="rp-status">正在读取…</div>',
      '<input id="rp-input" placeholder="上级钱包地址 0x…" autocomplete="off" spellcheck="false" />',
      '<button id="rp-btn" type="button">绑定上级</button>',
      '<div class="rp-hint" id="rp-hint"></div>',
      '<div class="rp-sep"></div>',
      '<div class="rp-kv"><span>团队业绩（下线）</span><b id="rp-team">-</b></div>',
      '<div class="rp-kv"><span>本人 + 团队</span><b id="rp-own">-</b></div>',
      '</div>'
    ].join('');
    document.body.appendChild(el);

    body = el.querySelector('.rp-body');
    statusEl = document.getElementById('rp-status');
    inputEl = document.getElementById('rp-input');
    btnEl = document.getElementById('rp-btn');
    hintEl = document.getElementById('rp-hint');
    teamEl = document.getElementById('rp-team');
    ownEl = document.getElementById('rp-own');
    toggleEl = document.getElementById('rp-toggle');

    // On narrow screens start collapsed so the panel does not cover the bet form.
    if (window.innerWidth && window.innerWidth < 560) {
      el.classList.add('rp-collapsed');
      toggleEl.textContent = '+';
    }
    el.querySelector('.rp-head').addEventListener('click', function () {
      var collapsed = el.classList.toggle('rp-collapsed');
      toggleEl.textContent = collapsed ? '+' : '−';
    });
    btnEl.addEventListener('click', bind);
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') bind();
    });

    var w = wallet();
    if (w && w.on) {
      w.on('accountsChanged', function () { refresh(); });
      w.on('chainChanged', function () { setTimeout(refresh, 300); });
    }
    refresh();
    setInterval(function () { if (!document.hidden) refresh(); }, 30000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();
</script>
